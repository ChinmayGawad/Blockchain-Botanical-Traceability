    <title>FloraChain — Blockchain Botanical Traceability & Verification</title>
    <meta name="description" content="Decentralized botanical supply chain provenance and verification platform powered by Hyperledger Fabric and IPFS." />
    <script>
      // Apply persisted theme before first paint to avoid a light-mode flash.
      (function () {
        try {
          var t = localStorage.getItem('florachain_theme');
          var dark =
            t === 'dark' ||
            ((!t || t === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-emerald-500 selection:text-white min-h-screen">
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
