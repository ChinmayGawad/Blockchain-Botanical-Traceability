name: FloraChain Production CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Smart Contracts & Meta-Tx Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Compile Solidity Contracts
        run: npx hardhat compile --config hardhat.config.cjs

      - name: Run Hardhat Contract Tests
        run: npm run test:contracts

  frontend:
    name: Frontend Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Vitest Unit Tests
        run: npm run test:unit

      - name: Type Check
        run: npm run typecheck

      - name: Build Production Assets
        run: npm run build

      - name: Check Bundle Budget
        run: npm run analyze:bundle

      - name: Upload Production Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          retention-days: 7

  backend:
    name: Spring Boot Backend & Flyway Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant Execute Permission to Maven Wrapper
        run: |
          if [ -f backend/mvnw ]; then
            chmod +x backend/mvnw
          fi

      - name: Run Maven Tests (with coverage gate)
        working-directory: ./backend
        env:
          JWT_SECRET: ci-only-signing-key-0123456789-abcdef
        run: |
          if [ -f ./mvnw ]; then
            ./mvnw --batch-mode verify
          else
            mvn --batch-mode verify
          fi

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
          retention-days: 7
