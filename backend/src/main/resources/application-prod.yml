spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/florachain_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  blockchain:
    rpc-url: ${BLOCKCHAIN_RPC_URL:https://rpc-amoy.polygon.technology}
    contract-address: ${BLOCKCHAIN_CONTRACT_ADDRESS:0x5FbDB2315678afecb367f032d93F642f64180aa3}
    network-name: ${BLOCKCHAIN_NETWORK_NAME:Polygon Amoy Testnet (Chain ID 80002)}
    private-key: ${BLOCKCHAIN_RELAYER_PRIVATE_KEY:}
  ipfs:
    gateway-url: ${IPFS_GATEWAY_URL:https://gateway.pinata.cloud/ipfs/}
    pinata-api-key: ${PINATA_API_KEY:}
    pinata-secret-key: ${PINATA_SECRET_KEY:}
    pinata-jwt: ${PINATA_JWT:}
    mock-mode: ${IPFS_MOCK_MODE:false}
  cors:
    allowed-origins:
      - ${CORS_FRONTEND_URL:http://localhost:5173}
      - https://florachain.vercel.app
      - https://florachain.netlify.app

logging:
  level:
    root: INFO
    com.florachain.backend: INFO
