server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: botanical-traceability-backend
  profiles:
    active: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # Secrets are environment-only. When unset, a random per-boot 256-bit key is
    # generated for non-production profiles; the prod profile fails fast instead.
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  security:
    rate-limit:
      auth-requests-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:15}
      general-requests-per-minute: ${RATE_LIMIT_GENERAL_PER_MINUTE:180}
  blockchain:
    rpc-url: ${BLOCKCHAIN_RPC_URL:https://ethereum-sepolia-rpc.publicnode.com}
    contract-address: ${BLOCKCHAIN_CONTRACT_ADDRESS:0x2B04B82dD07F1938E74b0CDCA9Fa5693Df147a87}
    network-name: ${BLOCKCHAIN_NETWORK_NAME:Ethereum Sepolia Testnet (Chain ID 11155111)}
    private-key: ${BLOCKCHAIN_RELAYER_PRIVATE_KEY:}
  mapbox:
    access-token: ${MAPBOX_ACCESS_TOKEN:}
  ipfs:
    gateway-url: ${IPFS_GATEWAY_URL:https://gateway.pinata.cloud/ipfs/}
    pinata-api-key: ${PINATA_API_KEY:}
    pinata-secret-key: ${PINATA_SECRET_KEY:}
    pinata-jwt: ${PINATA_JWT:}
    mock-mode: ${IPFS_MOCK_MODE:true}
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
      - http://127.0.0.1:5173

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true
  info:
    env:
      enabled: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.florachain.backend: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: INFO
