version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: florachain-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-florachain_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-florachain_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: florachain-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-florachain_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      # Secrets are environment only - the prod profile fails fast without a
      # strong (>= 256 bit) JWT_SECRET. No default is provided on purpose.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (see .env.example) - 256 bit minimum}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL:-https://ethereum-sepolia-rpc.publicnode.com}
      BLOCKCHAIN_CONTRACT_ADDRESS: ${BLOCKCHAIN_CONTRACT_ADDRESS:-0xFc06C5eeF51Cc050D2A663120E7d86745cF51745}
      BLOCKCHAIN_NETWORK_NAME: ${BLOCKCHAIN_NETWORK_NAME:-Ethereum Sepolia Testnet}
      BLOCKCHAIN_RELAYER_PRIVATE_KEY: ${BLOCKCHAIN_RELAYER_PRIVATE_KEY:-}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
      IPFS_GATEWAY_URL: ${IPFS_GATEWAY_URL:-https://gateway.pinata.cloud/ipfs/}
      PINATA_API_KEY: ${PINATA_API_KEY:-}
      PINATA_SECRET_KEY: ${PINATA_SECRET_KEY:-}
      IPFS_MOCK_MODE: ${IPFS_MOCK_MODE:-false}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-15}
      RATE_LIMIT_GENERAL_PER_MINUTE: ${RATE_LIMIT_GENERAL_PER_MINUTE:-180}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      CORS_FRONTEND_URL: ${CORS_FRONTEND_URL:-http://localhost}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health/readiness | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: florachain-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
      VITE_ERROR_REPORTING_URL: ${VITE_ERROR_REPORTING_URL:-}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
